<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماريو - الحركة السلسة</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #5c94fc;
            image-rendering: pixelated; 
        }

        #ui {
            position: absolute;
            top: 2%;
            left: 2%;
            font-size: 3vmin;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
        }
        
        #start-btn {
            padding: 15px 40px;
            font-size: 4vmin;
            background: linear-gradient(to bottom, #FFD700, #DAA520);
            color: #4a2500;
            border: 3px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 0 15px #FFD700;
        }
        #start-btn:hover { transform: scale(1.05); }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 100;
        }

        .control-group {
            pointer-events: auto;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }

        @media (max-height: 500px) {
            .btn { width: 60px; height: 60px; font-size: 30px; }
            #mobile-controls { height: 80px; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" width="1280" height="720"></canvas>
        
        <div id="ui">
            المستوى: <span id="level-display">1</span> / <span id="total-levels">0</span> | 💰: <span id="coin-display">0</span>
        </div>

        <div id="start-screen">
            <h1 style="font-size: 6vmin; margin: 0; color: #FFD700; text-shadow: 0 0 20px orange;">جمع الذهب</h1>
            <button id="start-btn">ابدأ اللعب</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="control-group">
            <div class="btn" id="btn-jump" style="background: rgba(231, 76, 60, 0.4);">▲</div>
        </div>
        <div class="control-group">
             <div class="btn" id="btn-right">▶</div>
            <div class="btn" id="btn-left">◀</div>
            
        </div>

    </div>

<script>
(function () {
    var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;

    var canvas = document.getElementById("canvas"),
        ctx = canvas.getContext("2d"),
        gameWrapper = document.getElementById("game-wrapper"),
        gameWidth = 1280,
        gameHeight = 720;

    var player = {
            x: 100,
            y: gameHeight - 100,
            width: 16,  // تم التصغير إلى 16 لمنع الالتصاق بالحواف
            height: 16, // تم التصغير إلى 16
            speed: 7, 
            velX: 0,
            velY: 0,
            jumping: false,
            grounded: false,
            color: '#E70011'
        },
        keys = [],
        friction = 0.85,
        gravity = 0.55,
        jumpPower = 2.0,
        coins = [],
        boxes = [],
        clouds = [],
        door = {},
        currentLevel = 0,
        score = 0,
        gameRunning = false;

    // --- نظام التحجيم ---
    function resizeGame() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var scale = Math.min(windowWidth / gameWidth, windowHeight / gameHeight);
        var newWidth = gameWidth * scale;
        var newHeight = gameHeight * scale;
        gameWrapper.style.width = newWidth + "px";
        gameWrapper.style.height = newHeight + "px";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
    }
    window.addEventListener("resize", resizeGame);
    resizeGame();

    // --- خرائط المراحل ---
    var levels = [
        // المستوى 1
        [
            "########################################",
            "#                                      #",
            "#                                      #",
            "#                                      #",
            "#                OO                    #",
            "#               ####                   #",
            "#                                      #",
            "#        OO              OO            #",
            "#       ####            ####           #",
            "#                                      #",
            "#                                      #",
            "#     ####                ####         #",
            "#                                      #",
            "#             OO  OO  OO               #",
            "#            ############              #",
            "#                                      #",
            "#                                     D#",
            "#    @                              ####",
            "#  #####     ###      ###     ##########",
            "#                                      #",
            "#                                      #",
            "########################################"
        ],
        // المستوى 2 (تم رفع المنصات لأعلى لتجنب الاصطدام بالرأس)
        [
            "########################################",
            "#D                                     #",
            "#####                                  #",
            "#         #                            #",
            "#                                      #",
            "#             OO         OO            #",
            "#            ####       ####           #",
            "#                                      #",
            "#                                      #",
            "#                                      #",
            "#       OO                             #",
            "#      ####             OO             #",
            "#                      ####            #",
            "#                                      #",
            "#       !         !         !          #",
            "#      ###       ###       ###         #",
            "#                                      #",
            "# @                                    #",
            "########################################",
            "########################################",
            "########################################",
            "########################################"
        ],
        // المستوى 3 (مفتوح)
        [
            "########################################",
            "#                                     D#",
            "#                                   ####",
            "#OO                                    #",
            "####              OO                   #",
            "#                ####                  #",
            "#                                      #",
            "#         OO                           #",
            "#        ####          OO              #",
            "#                     ####             #",
            "#  @                                   #",
            "#######             ####               #",
            "#            OO                        #",
            "#           ####             OO        #",
            "#                           ####       #",
            "#      !           !                   #",
            "#     ###         ###                  #",
            "########################################",
            "#                                      #",
            "#                                      #",
            "########################################"
        ],
        // المستوى 4 (قلعة)
        [
            "########################################",
            "#D #                                   #",
            "## #   OO                              #",
            "## #  ####      OO                     #",
            "## #           ####        OO          #",
            "## #                      ####         #",
            "## #           !  !  !                 #",
            "## ########################            #",
            "## #                                   #",
            "## #     OO   OO   OO                  #",
            "## #    ##############                 #",
            "## #                                   #",
            "## #                !                  #",
            "## #               ###                 #",
            "## #      !                            #",
            "## #     ###             !             #",
            "## #                    ###            #",
            "#@ #                                   #",
            "####                                   #",
            "#                                      #",
            "#!!!!!!!!!!!!!              !!!!!!!!!!!#",
            "########################################"
            
        ]
        ,[  "########################################",
            "#D #                                   #",
            "## #   OO                              #",
            "## #  ####      OO                     #",
            "## #           ####        OO          #",
            "## #                      ####         #",
            "## #           !  !  !                 #",
            "## ########################            #",
            "## #                                   #",
            "## #     OO   OO   OO                  #",
            "## #    ##############                 #",
            "## #                                   #",
            "## #                !                  #",
            "## #               ###                 #",
            "## #      !                            #",
            "## #     ###             !             #",
            "## #                    ###            #",
            "#@ #                                   #",
            "####                                   #",
            "#                                      #",
            "#!!!!!!!!!!!!!              !!!!!!!!!!!#",
            "########################################"]
    ];

    function startGame() {
        var elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        document.getElementById('start-screen').style.display = 'none';
        gameRunning = true;
        document.getElementById('total-levels').innerText = levels.length;
        initLevel(0);
        update();
    }
    document.getElementById('start-btn').addEventListener('click', startGame);

    function initLevel(lvlIndex) {
        if (lvlIndex >= levels.length) {
            alert("مبروك! أنهيت جميع المراحل! النقاط: " + score);
            currentLevel = 0; score = 0; lvlIndex = 0;
        }

        document.getElementById('level-display').innerText = lvlIndex + 1;
        document.getElementById('coin-display').innerText = score;

        boxes = []; coins = []; clouds = [];
        
        var levelMap = levels[lvlIndex];
        var tileSizeX = gameWidth / levelMap[0].length; 
        var tileSizeY = gameHeight / levelMap.length;

        for (var i = 0; i < levelMap.length; i++) {
            for (var j = 0; j < levelMap[i].length; j++) {
                var type = levelMap[i][j];
                var x = j * tileSizeX;
                var y = i * tileSizeY;

                if (type === '#') {
                    boxes.push({ x: x, y: y, width: tileSizeX, height: tileSizeY, type: 'ground' });
                } else if (type === '!') {
                    boxes.push({ x: x, y: y + (tileSizeY/2), width: tileSizeX, height: tileSizeY/2, type: 'lava' });
                } else if (type === 'O') {
                    coins.push({ x: x + 10, y: y + 10, width: tileSizeX - 20, height: tileSizeY - 20, collected: false });
                } else if (type === 'D') {
                    door = { x: x, y: y, width: tileSizeX, height: tileSizeY };
                } else if (type === '@') {
                    player.x = x; player.y = y; player.velX = 0; player.velY = 0;
                }
            }
        }
        
        for(var c=0; c<10; c++){
            clouds.push({ x: Math.random() * gameWidth, y: Math.random() * (gameHeight/2), size: Math.random() * 40 + 30, speed: Math.random() * 0.5 + 0.1 });
        }
    }
    
    function update() {
        if(!gameRunning) return;

        // منطق القفز
        if (keys[38] || keys[32]) { 
            if (!player.jumping && player.grounded) {
                player.jumping = true; 
                player.grounded = false;
                player.velY = -player.speed * jumpPower; 
            }
        }
        if (keys[39]) { if (player.velX < player.speed) player.velX++; }
        if (keys[37]) { if (player.velX > -player.speed) player.velX--; }

        player.velX *= friction;
        player.velY += gravity;

        // الخلفية
        ctx.fillStyle = (currentLevel === 2) ? "#444" : "#5c94fc";
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        // الغيوم
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        clouds.forEach(function(cloud){
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI*2);
            ctx.arc(cloud.x + cloud.size*0.6, cloud.y - cloud.size*0.4, cloud.size*0.8, 0, Math.PI*2);
            ctx.fill();
            cloud.x += cloud.speed;
            if(cloud.x > gameWidth + 100) cloud.x = -100;
        });

        // الأرضية
        boxes.forEach(function(box) {
            ctx.beginPath();
            if(box.type === 'lava') {
                ctx.fillStyle = "#ff0000";
                ctx.rect(box.x, box.y + Math.sin(Date.now()/200)*3, box.width, box.height);
                ctx.fill();
            } else {
                ctx.fillStyle = "#8B4513"; 
                ctx.fillRect(box.x, box.y, box.width, box.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#4a2500";
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                ctx.fillStyle = "#5c330a";
                ctx.fillRect(box.x + 3, box.y + 3, 5, 5);
                ctx.fillRect(box.x + box.width - 8, box.y + 3, 5, 5);
                ctx.fillRect(box.x + 3, box.y + box.height - 8, 5, 5);
                ctx.fillRect(box.x + box.width - 8, box.y + box.height - 8, 5, 5);
            }
        });

        // الباب
        ctx.fillStyle = "#222"; ctx.fillRect(door.x, door.y, door.width, door.height);

        // العملات
        var time = Date.now();
        coins.forEach(function(coin) { 
            if (!coin.collected) { 
                var centerX = coin.x + coin.width / 2;
                var centerY = coin.y + coin.height / 2;
                var spin = Math.abs(Math.sin(time / 150)); 
                var renderWidth = (coin.width / 2) * spin;
                
                var grad = ctx.createRadialGradient(centerX - renderWidth/3, centerY - 5, 2, centerX, centerY, coin.height/2);
                grad.addColorStop(0, "white");
                grad.addColorStop(0.3, "#FFD700");
                grad.addColorStop(0.9, "#DAA520");
                grad.addColorStop(1, "#B8860B");

                ctx.beginPath();
                ctx.fillStyle = grad;
                ctx.ellipse(centerX, centerY, renderWidth, coin.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#8B4513";
                ctx.lineWidth = 1;
                ctx.stroke();

                if (Math.floor(time / 200) % 5 === 0) {
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    var sX = centerX + (Math.sin(time/100) * 10);
                    var sY = centerY - 8;
                    ctx.moveTo(sX, sY - 4);
                    ctx.lineTo(sX + 2, sY);
                    ctx.lineTo(sX, sY + 4);
                    ctx.lineTo(sX - 2, sY);
                    ctx.fill();
                }
            } 
        });

        // الفيزياء والتصادم
        player.grounded = false;
        var death = false;
   
        for (var i = 0; i < boxes.length; i++) {
            var dir = colCheck(player, boxes[i]);
            
            if (dir && boxes[i].type === 'lava') {
                death = true;
            }

            if (dir === "l" || dir === "r") { 
                player.velX = 0; 
                // لا نوقف القفز هنا
            } else if (dir === "b") { 
                player.grounded = true; 
                player.jumping = false; 
            } else if (dir === "t") { 
                player.velY = 0; // تعديل هام: تصفير السرعة بدلاً من عكسها لمنع الارتداد للأسفل
            }
        }

        if(death) {
            resetLevel();
            requestAnimationFrame(update);
            return;
        }

        if(player.grounded) player.velY = 0;
        player.x += player.velX; player.y += player.velY;

        // رسم اللاعب
        ctx.fillStyle = player.color; 
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "#ffe0bd"; 
        ctx.fillRect(player.x + 3, player.y + 3, player.width - 6, 8);
        ctx.fillStyle = "black";
        if(player.velX >= 0) ctx.fillRect(player.x + 10, player.y + 5, 3, 3);
        else ctx.fillRect(player.x + 3, player.y + 5, 3, 3);

        for (var i = 0; i < coins.length; i++) { if (!coins[i].collected && simpleCol(player, coins[i])) { coins[i].collected = true; score += 10; document.getElementById('coin-display').innerText = score; } }
        if (simpleCol(player, door)) { currentLevel++; initLevel(currentLevel); }
        if (player.y >= gameHeight) resetLevel();

        requestAnimationFrame(update);
    }

    function resetLevel() { initLevel(currentLevel); }
    function colCheck(shapeA, shapeB) {
        var vX = (shapeA.x + (shapeA.width / 2)) - (shapeB.x + (shapeB.width / 2)),
            vY = (shapeA.y + (shapeA.height / 2)) - (shapeB.y + (shapeB.height / 2)),
            hWidths = (shapeA.width / 2) + (shapeB.width / 2),
            hHeights = (shapeA.height / 2) + (shapeB.height / 2),
            colDir = null;
        if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
            var oX = hWidths - Math.abs(vX), oY = hHeights - Math.abs(vY);
            if (oX >= oY) { if (vY > 0) { colDir = "t"; shapeA.y += oY; } else { colDir = "b"; shapeA.y -= oY; } } 
            else { if (vX > 0) { colDir = "l"; shapeA.x += oX; } else { colDir = "r"; shapeA.x -= oX; } }
        }
        return colDir;
    }
    function simpleCol(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y; }

    function setupTouch(id, k) {
        var b = document.getElementById(id);
        var handle = function(e){ e.preventDefault(); keys[k] = (e.type === 'touchstart' || e.type === 'mousedown'); if(keys[k]) b.classList.add('pressed'); else b.classList.remove('pressed'); };
        ['touchstart', 'touchend', 'mousedown', 'mouseup', 'mouseleave'].forEach(evt => b.addEventListener(evt, handle, {passive: false}));
    }
    setupTouch("btn-left", 37); setupTouch("btn-right", 39); setupTouch("btn-jump", 38);

    document.addEventListener("keydown", function (e) { keys[e.keyCode] = true; });
    document.addEventListener("keyup", function (e) { keys[e.keyCode] = false; });
})();
</script>

</body>
</html>
